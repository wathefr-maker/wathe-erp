<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wathe · Pilotage</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>

  :root{--violet:#2563eb;--violet-2:#3b82f6;--violet-soft:#dbeafe;--ink:#1e1b29;--muted:#6b7280;--line:#eceaf1;--bg:#f6f5f9;
    --green:#16a34a;--green-soft:#dcfce7;--blue:#2563eb;--blue-soft:#dbeafe;--slate-soft:#e5e7eb;--red:#dc2626;--amber:#d97706;--amber-soft:#fef3c7;
    --shadow:0 1px 2px rgba(20,16,40,.05),0 4px 16px rgba(20,16,40,.05);}
  *{box-sizing:border-box}html,body{margin:0;padding:0}
  body{font-family:"Plus Jakarta Sans",sans-serif;color:var(--ink);background:var(--bg);font-size:14px}
  .app{display:flex;min-height:100vh}
  .side{width:256px;flex-shrink:0;background:#fff;border-right:1px solid var(--line);padding:14px 12px;position:sticky;top:0;height:100vh;overflow-y:auto}
  .brand{display:flex;align-items:center;gap:10px;padding:6px 8px 16px}
  .brand .lg{width:32px;height:32px;border-radius:9px;background:linear-gradient(150deg,var(--violet),var(--violet-2));display:grid;place-items:center;color:#fff;font-weight:800}
  .brand b{font-size:16px;font-weight:800}
  .item{display:flex;align-items:center;gap:12px;padding:10px 10px;border-radius:10px;cursor:pointer;color:#374151;font-weight:700;font-size:14px;user-select:none}
  .item:hover{background:var(--bg)}.item.on{color:var(--violet);background:var(--violet-soft,#efeafe)}.item svg{width:20px;height:20px;flex-shrink:0}
  .navsec{color:var(--muted);font-size:11px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;padding:13px 10px 3px}
  .navbadge{margin-left:auto;background:#fef3c7;color:#92400e;font-size:11px;font-weight:800;padding:1px 8px;border-radius:20px}
  .item .chev{margin-left:auto;width:16px;height:16px;transition:.15s;color:var(--muted)}
  .group.open .ghead .chev{transform:rotate(180deg)}.group.open .ghead.on .chev{color:var(--violet)}
  .gbody{display:none;margin:2px 0 6px}.group.open .gbody{display:block}
  .item.sub{padding:8px 10px 8px 14px;font-weight:600;font-size:13px}.item.sub .ic{width:19px;height:19px;display:grid;place-items:center;flex-shrink:0}
  .main{flex:1;min-width:0;display:flex;flex-direction:column}
  .top{height:58px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 22px}
  .crumb{color:var(--muted);font-size:13px}.crumb b{color:var(--ink)}
  .soc{margin-left:auto;display:flex;align-items:center;gap:8px}.soc label{font-size:12px;color:var(--muted)}
  .soc select{border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:8px 12px;font:inherit;font-weight:600;color:var(--ink)}
  .avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#f59e0b,#ef4444)}
  .wrap{padding:24px 26px;max-width:1500px;width:100%}
  h1{font-size:22px;font-weight:800;margin:0 0 4px}.sub{color:var(--muted);font-size:13px;margin-bottom:18px}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:22px}
  .kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow)}
  .kpi .v{font-size:22px;font-weight:800}.kpi .l{color:var(--muted);font-size:12px;margin-top:2px}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow)}
  .card h3{margin:0 0 14px;font-size:13px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.4px}
  .row-soc{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)}.row-soc:last-child{border:0}
  .bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
  .btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 13px;font:inherit;font-weight:600;font-size:13px;cursor:pointer;color:var(--ink);transition:.12s}
  .btn:hover{border-color:#93c5fd}.btn.v{background:var(--violet);border-color:var(--violet);color:#fff}.btn.v:hover{background:var(--violet-2)}
  .btn.g{background:var(--green);border-color:var(--green);color:#fff}.btn.g:hover{background:#15803d}
  .btn.r{background:#fef2f2;border-color:#fecaca;color:#dc2626}.btn.r:hover{background:#fee2e2}
  .dhead{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
  .dhead h1{margin:0;font-size:24px}
  .backbtn{background:#fff;border:1px solid var(--line);border-radius:9px;padding:8px 12px;cursor:pointer;font:inherit;font-weight:600}
  .backbtn:hover{background:var(--bg)}
  .detail{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .dcard{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 20px}
  .dcard h3{margin:0 0 6px;font-size:14px;font-weight:800}
  .drow{display:flex;justify-content:space-between;gap:16px;padding:9px 0;border-top:1px solid var(--line);font-size:13px}
  .drow .k{color:var(--muted)}.drow .v{font-weight:600;text-align:right;word-break:break-word}
  @media(max-width:720px){.detail{grid-template-columns:1fr}}
  .twocol{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .grgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:720px){.twocol,.grgrid{grid-template-columns:1fr}}
  .chiprow{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 12px;border:1px solid var(--line);border-radius:9px;margin-bottom:6px;font-size:13px}
  .chiprow button{background:0;border:0;color:#dc2626;font-size:17px;cursor:pointer;line-height:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .szchip{background:var(--violet-soft);color:var(--violet);border-radius:8px;padding:3px 9px;font-size:12px;font-weight:600}
  .szc{display:inline-block;cursor:help;border-radius:6px;padding:1px 7px;position:relative;transition:background .12s}
  .szc:hover{background:var(--violet);color:#fff}
  .szc[data-corr]:hover::after{content:attr(data-corr);position:absolute;left:50%;bottom:140%;transform:translateX(-50%);background:#111827;color:#fff;padding:5px 10px;border-radius:7px;font-size:12px;font-weight:600;white-space:nowrap;z-index:60;box-shadow:0 6px 18px rgba(0,0,0,.28)}
  .ordlist{display:flex;flex-direction:column;gap:10px;max-width:780px}
  .ordrow{display:flex;align-items:center;gap:14px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;font-size:14px;cursor:grab}
  .ordrow .ordmove{color:var(--muted);font-size:18px;cursor:grab}
  .ordrow.dragging{opacity:.4}
  .ordrow.dragover{border-color:var(--violet);box-shadow:0 -3px 0 0 var(--violet)}
  .iconbtn{background:#fff;border:1px solid var(--line);border-radius:8px;padding:4px 9px;cursor:pointer;font-size:13px}
  .iconbtn:hover{background:var(--bg)}
  .spacer{flex:1}
  .filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
  .filters select,.filters input{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 10px;font:inherit;font-size:13px;color:var(--ink)}
  .tablecard{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
  .tmeta{padding:12px 16px;color:var(--muted);font-size:12px;border-bottom:1px solid var(--line)}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:left;color:var(--muted);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.4px;padding:11px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
  td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}tr:last-child td{border-bottom:0}
  .parent{cursor:pointer}.parent:hover td{background:#f4f7ff}
  .chevr{display:inline-block;transition:.15s;color:var(--muted)}.parent.open .chevr{transform:rotate(90deg)}
  .ref{font-variant-numeric:tabular-nums;color:var(--muted);font-size:12px}.lib{font-weight:600}.muted{color:var(--muted)}
  .sku{font-family:ui-monospace,monospace;font-size:12px;color:var(--muted)}
  .ginfo{display:grid;grid-template-columns:1fr 1fr;gap:16px 24px}
  .ginfo .gl{font-size:12px;color:var(--muted);margin-bottom:3px}
  .ginfo .gv{font-weight:600}
  .ac-wrap{position:relative}
  .ac-res{position:absolute;z-index:40;left:0;right:0;background:#fff;border:1px solid var(--line);border-radius:10px;margin-top:4px;max-height:240px;overflow:auto;box-shadow:0 10px 28px rgba(0,0,0,.12)}
  .ac-res .opt{padding:10px 12px;cursor:pointer;font-size:14px}
  .ac-res .opt:hover{background:var(--violet-soft)}
  .sw{position:relative;display:inline-block;width:54px;height:28px;flex:none}
  .sw input{opacity:0;width:0;height:0;position:absolute}
  .sw .sl{position:absolute;inset:0;background:#cbd5e1;border-radius:999px;transition:.2s;cursor:pointer}
  .sw .sl:before{content:"";position:absolute;width:22px;height:22px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
  .sw input:checked+.sl{background:var(--violet)}
  .sw input:checked+.sl:before{transform:translateX(26px)}
  .badge{display:inline-block;padding:3px 9px;border-radius:7px;font-size:11px;font-weight:700;white-space:nowrap}
  .b-stock{background:var(--green-soft);color:var(--green)}.b-transit{background:var(--blue-soft);color:var(--blue)}
.b-appro{background:#e0f2fe;color:#0284c7}
  .b-fact{background:#11182710;color:#111827}.b-vendu{background:var(--amber-soft);color:var(--amber)}
  .b-part{background:var(--slate-soft);color:#475569}.b-pro{background:#ccfbf1;color:#0d9488}
  .seclbl{grid-column:1/-1;font-weight:800;font-size:13px;margin-top:6px;padding-top:10px;border-top:1px solid var(--line);color:var(--ink)}
  .tag-soc{background:var(--violet-soft);color:var(--violet);padding:2px 8px;border-radius:6px;font-size:11px;font-weight:700}
  .childbox{background:#f4f7ff;padding:0 14px}.vtable{width:100%;font-size:12px;margin:6px 0}
  .vtable td,.vtable th{padding:7px 10px;border-bottom:1px solid var(--line)}
  .countpill{background:var(--slate-soft);color:#374151;border-radius:20px;padding:1px 9px;font-weight:700;font-size:11px}.countpill.has{background:var(--green-soft);color:var(--green)}
  .price b{display:block}.price small{color:var(--muted)}
  .dispo{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font-weight:800;color:#fff;font-size:13px;cursor:pointer}.dispo.y{background:var(--green)}.dispo.n{background:#cbd5e1}
  .act{display:flex;gap:6px}.act button{border:0;background:transparent;cursor:pointer;color:var(--muted);padding:4px;border-radius:6px;font-size:14px}.act button:hover{background:var(--bg);color:var(--ink)}
  .pager{display:flex;align-items:center;gap:6px;justify-content:flex-end;padding:12px 16px}
  .pager button{border:1px solid var(--line);background:#fff;border-radius:8px;min-width:30px;height:30px;cursor:pointer;font:inherit}.pager button.on{background:var(--violet);color:#fff;border-color:var(--violet)}
  .ov{position:fixed;inset:0;background:rgba(20,16,40,.45);display:none;align-items:center;justify-content:center;padding:20px;z-index:50}.ov.show{display:flex}
  .modal{background:#fff;border-radius:16px;width:560px;max-width:100%;max-height:92vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
  .mh{padding:18px 22px;border-bottom:1px solid var(--line);font-weight:800;font-size:16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:#fff;z-index:2}
  .mh .x{cursor:pointer;color:var(--muted);font-size:20px;border:0;background:0}
  .kickz{margin:16px 22px 0;background:var(--violet-soft);border:1px solid #bfdbfe;border-radius:12px;padding:12px 14px;display:flex;gap:10px;align-items:center}
  .kickz input{flex:1;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit;font-size:13px;background:#fff}
  .kickz .tagsoon{background:#fff;border:1px solid #bfdbfe;color:var(--violet);border-radius:20px;padding:2px 10px;font-size:11px;font-weight:700;white-space:nowrap}
  .mb{padding:18px 22px;display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .fld{display:flex;flex-direction:column;gap:5px}.fld.full{grid-column:1/3}
  .fld label{font-size:12px;color:var(--muted);font-weight:600}
  .fld input,.fld select{border:1px solid var(--line);border-radius:9px;padding:9px 11px;font:inherit;font-size:13px}
  .ac-wrap input,#a_modeleSearch,#al_modq{border-radius:12px}
  .mf{padding:14px 22px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;align-items:center;position:sticky;bottom:0;background:#fff}
  .mf .note{color:var(--muted);font-size:12px}
  .hide{display:none!important}.empty{padding:36px;text-align:center;color:var(--muted)}
  .chip{display:inline-flex;align-items:center;gap:7px;background:var(--ink);color:#fff;border-radius:20px;padding:5px 11px;font-size:12px;font-weight:600;cursor:pointer}
  .datefilter{display:inline-flex;flex-direction:column;gap:2px}
  .datefilter>label{font-size:11px;color:var(--muted);font-weight:600}
  .datefilter .dfin{display:flex;align-items:center;gap:6px}
  .datefilter input{border:1px solid var(--line);background:#fff;border-radius:9px;padding:6px 8px;font:inherit;font-size:13px}
  .infos small{display:block;color:var(--muted);font-size:11px}.infos b{font-size:12px}
  .soonpanel{background:#fff;border:1px dashed #bfdbfe;border-radius:16px;padding:48px;text-align:center;color:var(--muted)}
  .soonpanel .big{font-size:18px;font-weight:800;color:var(--ink);margin-bottom:6px}
  .soonpanel .ph{display:inline-block;margin-top:10px;background:var(--violet-soft);color:var(--violet);border-radius:20px;padding:4px 12px;font-weight:700;font-size:12px}
  .askbtn{position:fixed;right:16px;bottom:16px;z-index:60;background:linear-gradient(150deg,var(--violet),var(--violet-2));color:#fff;border:0;border-radius:30px;padding:8px 13px;font:inherit;font-weight:700;font-size:12.5px;cursor:pointer;box-shadow:0 4px 14px rgba(37,99,235,.28);opacity:.45;transition:opacity .18s,transform .18s}
  .askbtn:hover{opacity:1;transform:translateY(-1px)}
  .askpanel{position:fixed;right:22px;bottom:22px;width:380px;max-width:calc(100vw - 44px);height:560px;max-height:calc(100vh - 44px);background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 20px 60px rgba(20,16,40,.3);z-index:61;display:none;flex-direction:column;overflow:hidden}
  .askpanel.show{display:flex}
  .askhead{background:linear-gradient(150deg,var(--violet),var(--violet-2));color:#fff;padding:14px 16px;font-weight:800;display:flex;align-items:center;justify-content:space-between}

  .askbody{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--bg)}
  .msg{max-width:85%;padding:10px 12px;border-radius:12px;font-size:13px;line-height:1.5;white-space:pre-wrap}
  .msg.u{align-self:flex-end;background:var(--violet);color:#fff;border-bottom-right-radius:4px}
  .msg.a{align-self:flex-start;background:#fff;border:1px solid var(--line);border-bottom-left-radius:4px}
  .msg.a.think{color:var(--muted);font-style:italic}
  .asksug{display:flex;flex-wrap:wrap;gap:6px;padding:0 14px 10px;background:var(--bg)}
  .asksug button{background:#fff;border:1px solid var(--line);border-radius:16px;padding:5px 10px;font:inherit;font-size:12px;cursor:pointer;color:var(--violet)}
  .askfoot{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line);background:#fff}
  .askfoot input{flex:1;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;font-size:13px}
  .askfoot button{background:var(--violet);color:#fff;border:0;border-radius:10px;padding:0 16px;font-weight:700;cursor:pointer}

  /* ===== Refonte design : aération + bleu ===== */
  .ico{width:1em;height:1em;vertical-align:-0.15em;flex:none}
  .ic svg{width:18px;height:18px}
  .item svg.ico,.ghead svg{}
  .act button svg{width:18px;height:18px;vertical-align:middle}
  .iconbtn svg{width:15px;height:15px;vertical-align:-2px}

  .ordmove svg{width:20px;height:20px}
  body{font-size:15px;line-height:1.5}

  th{padding:14px 18px;font-size:11.5px}

<script>
/* ============================================================================
   PLATEFORME DE PILOTAGE — WATHE
   Sortie de l'ERP pour que les analyses puissent évoluer sans risquer de casser
   la gestion quotidienne, et pour que l'ERP cesse de porter ce poids au
   chargement.

   Elle lit la MÊME base Supabase que l'ERP : aucune donnée n'est dupliquée, il
   n'y a donc jamais de décalage entre les deux outils. La connexion utilise le
   même compte.

   Écriture : uniquement les cibles de réassort (TODS), qui vivent sur les fiches
   modèles. Tout le reste est en lecture seule.
   ============================================================================ */
const SB_URL="https://tqznrfjbgnwoatohkyxt.supabase.co";
const SB_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRxem5yZmpiZ253b2F0b2hreXh0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA3NDgwNDUsImV4cCI6MjA5NjMyNDA0NX0.MoVQq8phK6bU3oja0p1jvOR0uWdObyF_AvdR62I4i6U";
const sb=supabase.createClient(SB_URL,SB_KEY);

/* Tables strictement nécessaires aux analyses. L'ERP en charge le double : ne
   pas lire ce qui ne sert pas, c'est autant de secondes gagnées au démarrage. */
const TABLES=["societes","modeles","variantes","articles","achats","factures","attributs"];
let DB={societes:[],modeles:[],variantes:[],articles:[],achats:[],factures:[],attributs:[],grilles:{},journal:[]};
let socFilter="";

/* ---------- Utilitaires repris de l'ERP ---------- */
const CORR=[[35.5,3.5,5],[36,4,5.5],[36.5,4.5,6],[37.5,5,6.5],[38,5.5,7],[38.5,6,7.5],[39,6.5,8],[40,7,8.5],[40.5,7.5,9],[41,8,9.5],[42,8.5,10],[42.5,9,10.5],[43,9.5,11],[44,10,11.5],[44.5,10.5,12],[45,11,null],[45.5,11.5,null],[46,12,null],[47,12.5,null],[47.5,13,null],[48.5,14,null],[49.5,15,null]];
const fmtN=v=>Number.isInteger(v)?String(v):(+v).toFixed(1);
const esc=s=>String(s==null?"":s).replace(/[&<>]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[m]));
function r2(x){return Math.round(((+x||0)+Number.EPSILON)*100)/100;}
const eur=n=>r2(n).toFixed(2).replace(".",",")+" €";
const today=()=>new Date().toISOString().slice(0,10);
function isoD(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function szNorm(s){return String(s==null?"":s).trim().toLowerCase().replace(/\s+/g,"").replace(",",".");}
const modeleById=id=>DB.modeles.find(m=>m.id==id)||{};
const varsOf=mid=>DB.variantes.filter(v=>v.modeleId==mid);
let _vMap=null,_vMapN=-1;
function vIndexInvalidate(){_vMap=null;_vMapN=-1;}
function _vIndex(){
  var arr=DB.variantes||[];
  if(!_vMap||_vMapN!==arr.length){
    _vMap=new Map();
    for(var i=0;i<arr.length;i++){var v=arr[i];if(v&&v.id!=null)_vMap.set(String(v.id),v);}
    _vMapN=arr.length;
  }
  return _vMap;
}
const varById=id=>(id==null?{}:(_vIndex().get(String(id))||{}));
const inStock=a=>a.statut==="En Stock"||a.statut==="Transit";
function shopTailleEU(taille,grille){
  const t=String(taille==null?"":taille).trim();if(!t)return "";
  if(grille&&grille.indexOf("Unisexe (EU")===0)return t;             // EU (demi-pointures OU tiers) : déjà en EU
  if(grille==="Femme (US W)"){const n=parseFloat(t);const r=CORR.find(x=>x[2]===n);return r?fmtN(r[0]):t;}
  if(grille==="Homme (US)"){const n=parseFloat(t);const r=CORR.find(x=>x[1]===n);return r?fmtN(r[0]):t;}
  // Grilles nommées librement (ex. "ON Running — Homme", "ON Running — Femme") : elles ont
  // leur propre table EU->US dans DB.grilles["__us"]. On l'INVERSE pour passer d'une pointure
  // US stockée vers l'EU envoyé à Shopify. Ça couvre toute grille custom, sans nom en dur.
  var usMap=(DB.grilles&&DB.grilles["__us"]&&DB.grilles["__us"][grille])||null;
  if(usMap){
    var nt=parseFloat(t);
    for(var eu in usMap){
      // match tolérant : "7" == "7.0", "8.5" == "8,5"
      if(parseFloat(String(usMap[eu]).replace(",","."))===nt)return String(eu);
    }
    // rien trouvé dans la table : on renvoie la taille telle quelle (ne casse rien)
    return t;
  }
  return t;                                                             // junior/enfant/textile/TU : telle quelle
}
function shopSizeEU(v){if(v&&v.eu!=null&&v.eu!=="")return String(v.eu);const m=modeleById(v.modeleId)||{};return shopTailleEU(v.taille,m.grille)||String(v.taille||"");}
function vEUUS(v){if(!v)return {eu:"",us:""};const m=modeleById(v.modeleId)||{};const usMap=(DB.grilles["__us"]||{})[m.grille]||{};const eu=shopSizeEU(v);let us=usMap[String(v.taille)]||usMap[String(eu)]||"";if(!us&&/\(US/.test(m.grille||""))us=String(v.taille||"");return {eu:String(eu||""),us:String(us||"")};}
function vSizeTxt(v){const s=vEUUS(v);return (s.us&&s.eu&&s.us!==s.eu)?(s.us+" (EU "+s.eu+")"):(s.us||s.eu||(v&&v.taille)||"");}
function pieceMarque(a){const v=varById(a.varianteId)||{};const m=modeleById(v.modeleId)||{};return (m.marque&&String(m.marque).trim())?m.marque:"Sans marque";}
function shopFamille(m){
  var t=String((m&&m.taxo)||"");
  if(/handbags|wallets|cases|luggage/i.test(t))return "maroquinerie";
  if(/>\s*Shoes/i.test(t))return "chaussures";
  if(/jewelry/i.test(t))return "bijouterie";
  if(/clothing\s+accessories/i.test(t))return "accessoires";
  if(/clothing/i.test(t))return "vetements";
  return "";                                   // taxonomie vide ou hors liste
}
function attrLabels(name){return ((DB.attributs||[]).find(a=>(a.nom||"").toLowerCase()===name.toLowerCase())||{valeurs:[]}).valeurs.map(v=>v.label);}
function viCfg(){
  // Renvoie {taker, giver, rate} si une cession est configurée, sinon null.
  var socs=DB.societes||[];
  for(var i=0;i<socs.length;i++){var s=socs[i];
    if(s&&s.cessionFrom!=null&&s.cessionFrom!==""){
      return {taker:s.id, giver:s.cessionFrom, rate:(+s.cessionRate||0)};
    }
  }
  return null;
}
function viRate(){var c=viCfg();return c?c.rate:0;}
function viCededCost(a){var r=viRate();return Math.round(((+a.prix||0)*(1+r/100))*100)/100;}
function viCost(a){return (a&&a.viCededAtSale!=null)?(+a.viCededAtSale):viCededCost(a);}
function lineCost(l,a){
  if(l&&l.cost!=null&&l.cost!=="")return +l.cost;
  if(a&&a.viSoldBy!=null)return viCost(a);
  return +((a&&a.prix)||0);
}

/* ---------- Journal : traçabilité des cibles de réassort ---------- */
function logAct(action,entite,detail){
  // Non bloquant : une trace manquante ne doit jamais empêcher un enregistrement.
  try{
    sb.from("journal").insert([{id:Date.now()*1000+Math.floor(Math.random()*1000),
      data:{ts:new Date().toISOString(),action:action,entite:entite,detail:detail,source:"Pilotage"}}]);
  }catch(e){}
}

/* ---------- Sauvegarde ciblée ----------
   Seul TODS écrit, et seulement sur les fiches modèles (produit essentiel, grille
   de suivi, cibles par taille). On n'écrit donc que les modèles RÉELLEMENT
   modifiés, comparés à l'instantané du chargement. Toucher aux autres tables
   depuis cet outil n'aurait aucun sens et ferait courir un risque inutile. */
let _snapModeles=new Map();
function _snapshot(){
  _snapModeles=new Map();
  (DB.modeles||[]).forEach(function(m){_snapModeles.set(m.id,JSON.stringify(m));});
}
async function save(){
  try{
    const up=[];
    (DB.modeles||[]).forEach(function(m){
      if(m.id==null)return;
      const j=JSON.stringify(m);
      if(_snapModeles.get(m.id)!==j){up.push({id:m.id,data:m});_snapModeles.set(m.id,j);}
    });
    if(!up.length)return;
    for(let i=0;i<up.length;i+=200){
      const {error}=await sb.from("modeles").upsert(up.slice(i,i+200));
      if(error)throw error;
    }
  }catch(e){
    console.error("Enregistrement :",e);
    alert("Enregistrement impossible : "+(e.message||e)+"\n\nTes modifications ne sont pas perdues à l'écran, mais elles ne sont pas enregistrées.");
  }
}

/* ---------- Chargement ---------- */
async function _lire(table){
  const out=[];let from=0;
  for(;;){
    const {data,error}=await sb.from(table).select("id,data").order("id",{ascending:true}).range(from,from+999);
    if(error)throw new Error(table+" : "+error.message);
    const b=data||[];
    for(const r of b)out.push({...(r.data||{}),id:r.id});
    if(b.length<1000)break;
    from+=1000;
  }
  return out;
}
async function load(){
  const info=document.getElementById("chargeInfo");
  try{
    for(const t of TABLES){
      if(info)info.textContent="Chargement : "+t+"…";
      DB[t]=await _lire(t);
    }
    // Les sizecharts tiennent dans une seule ligne, à part des autres tables.
    const {data:gd}=await sb.from("grilles").select("id,data");
    DB.grilles=(gd&&gd[0]&&gd[0].data)?gd[0].data:{};
  }catch(e){
    if(info)info.textContent="";
    document.getElementById("chargement").innerHTML=
      '<div class="tablecard" style="padding:26px;text-align:center">'
      +'<div style="font-weight:700;margin-bottom:6px">Chargement impossible</div>'
      +'<div class="muted" style="font-size:13px">'+esc(e.message||e)+'</div></div>';
    throw e;
  }
  vIndexInvalidate();_snapshot();
  if(info)info.textContent=DB.articles.length+" pièces · "+DB.modeles.length+" modèles · "+DB.factures.length+" factures";
  remplirSocietes();
  document.getElementById("chargement").style.display="none";
  document.getElementById("app").style.display="";
  renderStats();
}

function remplirSocietes(){
  const sel=document.getElementById("socSel");if(!sel)return;
  sel.innerHTML='<option value="">Toutes les sociétés</option>'
    +(DB.societes||[]).map(function(s){return '<option value="'+s.id+'">'+esc(s.nom||("Société "+s.id))+'</option>';}).join("");
  sel.value=socFilter||"";
  sel.onchange=function(){socFilter=sel.value||"";renderStats();};
}

/* ---------- Modules repris de l'ERP ---------- */
var _statTab="tods";
function statTab(t){_statTab=t;renderStats();}
function renderStats(){
  var tabs=document.getElementById("statTabs");
  if(tabs){
    var defs=[["tods","TODS — Réassort"],["achat","Aide à la commande"]];
    tabs.innerHTML=defs.map(function(d){
      var on=_statTab===d[0];
      return '<button onclick="statTab(\''+d[0]+'\')" style="background:none;border:none;cursor:pointer;'
        +'padding:9px 2px 11px;font-size:14px;font-weight:'+(on?"800":"600")+';'
        +'color:'+(on?"#2563eb":"var(--muted)")+';'
        +'border-bottom:2px solid '+(on?"#2563eb":"transparent")+'">'+d[1]+'</button>';
    }).join("");
  }
  if(_statTab==="tods")renderReassort();
  else if(_statTab==="achat")renderAideCommande();
}

/* ============================================================================
   AIDE À LA COMMANDE
   Croise ce qui se VEND avec ce qui est EN STOCK, pour décider quoi racheter.

   Trois mesures portent tout le module :
     · la cadence   — paires vendues par mois sur la période observée
     · la couverture— combien de mois de vente le stock actuel représente
     · la tension   — part des ventes moins part du stock, en points
   La tension est l'indicateur d'assortiment : positive, on vend un segment plus
   qu'on ne le détient, donc il manque ; négative, l'argent dort.

   Le délai d'écoulement (entrée en stock -> vente) complète le tableau : deux
   marques peuvent faire le même chiffre, celle qui tourne en trois semaines vaut
   mieux que celle qui met six mois.

   Les ventes sont lues dans les FACTURES et non sur les pièces : seule la vente
   boutique horodate la pièce, les ventes Shopify et les expéditions ne posent
   pas dateVente. Passer par les factures couvre tous les canaux et tient compte
   des avoirs, qui retirent une vente au lieu d'en ajouter une.
   ============================================================================ */
var _acJours=180, _acSansDepot=true, _acWeb=true, _acTopN=25;
/* Croisements rayon × état que la boutique ne travaille pas : les afficher
   remplit le tableau de lignes vides ou anecdotiques qui noient les segments
   réels. Ils restent comptés dans le budget, où un capital immobilisé — même sur
   un segment qu'on ne travaille plus — doit rester visible. */
var AC_SEGMENTS_MASQUES=["Textile · Occasion","Maroquinerie · Neuf"];
/* Compteurs de ce qui a été écarté, affichés sous la barre de contrôle : une
   exclusion silencieuse est une exclusion qu'on oublie en lisant les chiffres. */
var _acExclus={ventes:0,stock:0};

/* Neuf ou seconde main. La liste d'attributs contient « Très bon état », « Bon
   état », « État correct »… qui sont tous de l'occasion : seul ce qui commence
   par « Neuf » est du neuf (y compris « Neuf avec défaut », qui reste du stock
   jamais porté). */
function acEtat(a){return /^neuf/i.test(String((a&&a.etat)||""))?"Neuf":"Occasion";}

/* Genre déclaré par le sizechart du modèle. */
function acGenre(m){
  var g=String((m&&(m.todsGrille||m.grille))||"");
  if(/femme|women|wmns/i.test(g))return "Femme";
  if(/junior|\bgs\b/i.test(g))return "Junior";
  if(/enfant|\bps\b|\btd\b|bebe|bébé/i.test(g))return "Enfant";
  if(/homme|men/i.test(g))return "Homme";
  return "Non classé";
}

/* Famille de produit, lue dans la taxonomie Shopify du modèle — le seul champ
   qui dise ce QU'EST l'article. Sneakers, maroquinerie et textile ne se pilotent
   pas de la même façon : ni les mêmes marges, ni les mêmes rotations, ni les
   mêmes budgets. Les mélanger dans une moyenne ne dit plus rien.
   « Non classé » est un signal utile : ces modèles n'ont pas de taxonomie
   renseignée, et leurs chiffres ne sont donc rattachables à aucun rayon. */
function acFamille(m){
  var f=(typeof shopFamille==="function")?shopFamille(m):"";
  return {chaussures:"Sneakers",maroquinerie:"Maroquinerie",vetements:"Textile",
          accessoires:"Accessoires",bijouterie:"Bijouterie"}[f]||"Non classé";
}

/* Pointure EU d'une pièce, en nombre. shopSizeEU convertit déjà l'US vers l'EU
   selon la grille du modèle, ce qui est indispensable : une même pointure saisie
   en 9 US ou en 43 EU doit tomber dans la même tranche. */
function acEU(a){
  var v=varById(a&&a.varianteId)||{};
  var s=String(shopSizeEU(v)||v.taille||"").trim().replace(",",".");
  var m=s.match(/^(\d{2}(?:\.\d)?)/);
  var n=m?parseFloat(m[1]):null;
  return (n&&n>=15&&n<=55)?n:null;
}

/* Tranches de pointure : c'est à cette maille qu'on commande, pas à la taille
   près. Le découpage suit le marché : sous 38 c'est du féminin, au-dessus de 45
   du grand pied — deux segments où la rupture se voit tout de suite. */
var AC_TRANCHES=["≤ 37,5","38 – 40","40,5 – 42,5","43 – 45","≥ 45,5","Inconnue"];
function acTranche(eu){
  if(eu==null)return "Inconnue";
  if(eu<=37.5)return "≤ 37,5";
  if(eu<=40)return "38 – 40";
  if(eu<=42.5)return "40,5 – 42,5";
  if(eu<=45)return "43 – 45";
  return "≥ 45,5";
}

/* Jours entre l'entrée en stock et la vente. Une valeur aberrante (négative, ou
   au-delà de dix ans) vient d'une date d'entrée mal saisie : on l'écarte plutôt
   que de la laisser fausser une médiane. */
function acDelai(a,dateFin){
  var d0=String((a&&a.date)||"").slice(0,10), d1=String(dateFin||"").slice(0,10);
  if(!d0||!d1)return null;
  var t0=new Date(d0+"T00:00:00"), t1=new Date(d1+"T00:00:00");
  if(isNaN(t0.getTime())||isNaN(t1.getTime()))return null;
  var n=Math.round((t1-t0)/86400000);
  return (n>=0&&n<3650)?n:null;
}

/* Médiane et non moyenne : une seule paire oubliée deux ans en réserve suffit à
   faire paraître lente une marque qui tourne très bien. */
function acMediane(arr){
  if(!arr||!arr.length)return null;
  var a=arr.slice().sort(function(x,y){return x-y;});
  var i=Math.floor(a.length/2);
  return a.length%2?a[i]:Math.round((a[i-1]+a[i])/2);
}

/* Achats passés par FlowStock. C'est du dropshipping : la paire est commandée
   au fournisseur une fois le client servi, elle ne dort jamais en rayon et
   n'immobilise aucun capital. Elle n'a donc rien à faire ici, ni dans la demande
   — elle ne crée pas de besoin de réassort — ni dans le stock, ni dans le budget
   où elle produirait une marge sans contrepartie investie.
   L'exclusion est une règle, pas une option : le seul stock que cet écran pilote
   est celui qui vient des commandes d'achat.
   Index construit en une passe : un find par pièce sur plusieurs milliers
   d'articles rendait l'écran lent. */
function acFlowstockIds(){
  var set={};
  (DB.achats||[]).forEach(function(a){
    if(a&&a.source==="flowstock"&&a.id!=null)set[String(a.id)]=1;
  });
  return set;
}

function acIndexRefs(){
  var idx={};
  (DB.articles||[]).forEach(function(a){if(a&&a.ref)idx[String(a.ref)]=a;});
  return idx;
}

/* Les ventes d'une période, une ligne par paire vendue.
   « decalage » recule la fenêtre d'autant de jours : lui passer la durée de la
   période donne la période PRÉCÉDENTE, à durée égale, seule façon de comparer
   deux tranches comparables. */
function acVentes(jours,decalage){
  decalage=+decalage||0;
  var dFin=new Date(); dFin.setDate(dFin.getDate()-decalage);
  var dDeb=new Date(); dDeb.setDate(dDeb.getDate()-decalage-(jours-1));
  var to=decalage?isoD(dFin):today(), from=isoD(dDeb);
  var idx=acIndexRefs(), out=[];
  var fsIds=acFlowstockIds();
  /* Le compteur ne vaut que pour la fenêtre affichée : l'appel sur la période
     PRÉCÉDENTE, fait juste après pour calculer les tendances, écraserait sinon
     le chiffre montré à l'écran par celui d'une fenêtre qu'on n'affiche pas. */
  var courante=(decalage===0);
  if(courante)_acExclus.ventes=0;
  (DB.factures||[]).forEach(function(f){
    if(!f||!f.lines)return;
    var dt=String(f.date||"").slice(0,10);
    if(!dt||dt<from||dt>to)return;
    if(socFilter&&f.societeId!=socFilter)return;
    /* Une cession interne n'est pas une vente client : la même paire serait
       comptée deux fois, une fois à la cession et une fois à la vente réelle. */
    if(f.source==="expedition"&&f.viInternal)return;
    /* Vient du site : soit la facture porte l'identifiant de commande Shopify,
       soit son canal le dit. Les deux formes existent selon la façon dont la
       facture a été créée ; ne tester que l'identifiant laissait passer les
       secondes, qui se seraient retrouvées comptées comme des ventes boutique. */
    var web=!!f.orderId||/shopify|site|web/i.test(String(f.canal||""));
    if(!_acWeb&&web)return;
    var sign=(f.type==="avoir")?-1:1;
    var canal=web?"Site web":(f.source==="expedition"?"Expédition":(f.canal||"Boutique"));
    (f.lines||[]).forEach(function(l){
      (l.refs||[]).forEach(function(ref){
        var a=idx[String(ref)];if(!a)return;
        if(_acSansDepot&&a.depot)return;
        if(a.achatId!=null&&fsIds[String(a.achatId)]){if(courante)_acExclus.ventes++;return;}
        var v=varById(a.varianteId)||{};
        var m=(v.modeleId!=null?modeleById(v.modeleId):null)||{};
        var ttc=+l.puTTC||0, cost=lineCost(l,a), eu=acEU(a);
        out.push({a:a,m:m,v:v,date:dt,sign:sign,
          ttc:r2(ttc*sign), cost:r2(cost*sign), marge:r2((ttc-cost)*sign),
          eu:eu, tranche:acTranche(eu), genre:acGenre(m), etat:acEtat(a),
          famille:acFamille(m), segment:(acFamille(m)+" · "+acEtat(a)),
          marque:pieceMarque(a), canal:canal, depot:!!a.depot,
          modeleId:(v.modeleId!=null?v.modeleId:null),
          titre:(m.fr||m.sku||a.ref||"?"),
          jours:acDelai(a,dt)});
      });
    });
  });
  return {from:from,to:to,jours:jours,lignes:out};
}

/* Le stock disponible aujourd'hui, à la même maille que les ventes. */
function acStock(){
  var out=[], fsIds=acFlowstockIds();
  _acExclus.stock=0;
  (DB.articles||[]).forEach(function(a){
    if(!a||a.archived||!inStock(a))return;
    if(socFilter&&a.societeId!=socFilter)return;
    if(_acSansDepot&&a.depot)return;
    if(a.achatId!=null&&fsIds[String(a.achatId)]){_acExclus.stock++;return;}
    var v=varById(a.varianteId)||{};
    var m=(v.modeleId!=null?modeleById(v.modeleId):null)||{};
    var eu=acEU(a);
    out.push({a:a,m:m,v:v,eu:eu,tranche:acTranche(eu),genre:acGenre(m),etat:acEtat(a),
      famille:acFamille(m), segment:(acFamille(m)+" · "+acEtat(a)),
      marque:pieceMarque(a), cout:(+a.prix||0), pv:(+a.pv||0), depot:!!a.depot,
      modeleId:(v.modeleId!=null?v.modeleId:null),
      titre:(m.fr||m.sku||a.ref||"?"),
      age:acDelai(a,today())});
  });
  return out;
}

/* Croise demande et offre sur un axe donné (tranche, marque, genre…). */
function acCroise(ventes,stock,cle,jours){
  var V={},S={},clefs={};
  ventes.forEach(function(r){
    var k=cle(r); if(k==null||k==="")return; clefs[k]=1;
    var e=V[k]||(V[k]={n:0,ca:0,marge:0,cout:0,jours:[]});
    e.n+=r.sign; e.ca+=r.ttc; e.marge+=r.marge; e.cout+=r.cost;
    if(r.sign>0&&r.jours!=null)e.jours.push(r.jours);
  });
  stock.forEach(function(r){
    var k=cle(r); if(k==null||k==="")return; clefs[k]=1;
    var e=S[k]||(S[k]={n:0,valeur:0,ages:[]});
    e.n++; e.valeur+=r.cout; if(r.age!=null)e.ages.push(r.age);
  });
  var totV=0,totS=0;
  Object.keys(clefs).forEach(function(k){totV+=(V[k]?Math.max(0,V[k].n):0);totS+=(S[k]?S[k].n:0);});
  var mois=Math.max(0.1,jours/30.4);
  return Object.keys(clefs).map(function(k){
    var v=V[k]||{n:0,ca:0,marge:0,cout:0,jours:[]}, s=S[k]||{n:0,valeur:0,ages:[]};
    var cadence=Math.max(0,v.n)/mois;
    /* Couverture : mois de vente que le stock représente. Sans vente sur la
       période, elle n'est pas calculable — Infinity le dit sans mentir. */
    var couv=cadence>0?(s.n/cadence):(s.n>0?Infinity:0);
    var pv=totV>0?(Math.max(0,v.n)/totV*100):0, ps=totS>0?(s.n/totS*100):0;
    var delai=acMediane(v.jours);
    /* Rendement annualisé du capital : taux de marge multiplié par le nombre de
       fois où l'argent tourne dans l'année. « Pour 100 € investis, X € de marge
       par an. » C'est ce qui départage 50 € de marge en dix jours et 300 € en six
       mois : le premier fait tourner la mise dix-huit fois, le second deux.
       Plancher de sept jours, sinon une vente le jour de la réception envoie le
       calcul vers l'infini. */
    var rendAn=null;
    if(v.cout>0&&delai!=null)rendAn=r2((v.marge/v.cout)*(365/Math.max(7,delai))*100);
    return {cle:k, vendu:v.n, ca:r2(v.ca), marge:r2(v.marge), coutVendu:r2(v.cout),
      margePct:(v.ca>0?r2(v.marge/v.ca*100):0),
      delai:delai, rendAn:rendAn, stock:s.n, valeurStock:r2(s.valeur),
      ageStock:acMediane(s.ages), cadence:Math.round(cadence*10)/10,
      couverture:couv, partV:r2(pv), partS:r2(ps), tension:r2(pv-ps),
      avant:null, evol:null, evolFragile:false};
  }).sort(function(x,y){return y.vendu-x.vendu;});
}

/* Évolution d'un segment entre la période précédente et la période courante.
   Sans elle l'écran n'est qu'un instantané : une couverture de deux mois n'appelle
   pas la même décision selon que le segment monte ou décroche.
   Une variation calculée sur de très petits volumes ne veut rien dire — passer
   d'une à trois ventes fait +200 % — d'où le drapeau « fragile », que l'affichage
   grise au lieu de le mettre en avant. */
function acTendance(rows,ventesAvant,cle){
  var A={};
  (ventesAvant||[]).forEach(function(r){
    var k=cle(r); if(k==null||k==="")return;
    A[k]=(A[k]||0)+r.sign;
  });
  rows.forEach(function(r){
    var av=Math.max(0,A[r.cle]||0), ap=Math.max(0,r.vendu);
    r.avant=av;
    r.evol=(av>0)?r2((ap-av)/av*100):(ap>0?null:0);   // null : aucune base de comparaison
    r.evolFragile=(av<3&&ap<3);
  });
  return rows;
}

/* ---- Rendu : briques communes -------------------------------------------- */
function acBarre(pct,couleur,ref){
  var max=Math.max(1,+ref||100);
  var p=Math.max(0,Math.min(100,(+pct||0)/max*100));
  return '<div style="height:6px;background:#f1f5f9;border-radius:3px;overflow:hidden;min-width:54px">'
    +'<div style="height:100%;width:'+p.toFixed(1)+'%;background:'+couleur+'"></div></div>';
}
function acCouvTxt(c){
  if(c===Infinity)return '<b style="color:#b91c1c">aucune vente</b>';
  if(!c)return '<b style="color:#b91c1c">rupture</b>';
  var col=c<1?"#b91c1c":(c<2?"#b45309":(c>6?"#6d28d9":"#166534"));
  return '<b style="color:'+col+'">'+(c<10?String(Math.round(c*10)/10).replace(".",","):Math.round(c))+' mois</b>';
}
function acTensionTxt(t){
  var col=t>5?"#166534":(t<-5?"#b91c1c":"#64748b");
  var fl=t>5?"▲":(t<-5?"▼":"—");
  return '<b style="color:'+col+'">'+fl+' '+(t>0?"+":"")+String(r2(t)).replace(".",",")+'</b>';
}
function acEvolTxt(r){
  if(r.evol===null)return '<b style="color:#166534" title="Rien sur la période précédente">nouveau</b>';
  if(!r.avant&&!r.vendu)return '<span class="muted">—</span>';
  var col=r.evolFragile?"#94a3b8":(r.evol>=10?"#166534":(r.evol<=-10?"#b91c1c":"#64748b"));
  var fl=r.evol>=10?"▲":(r.evol<=-10?"▼":"=");
  return '<b style="color:'+col+'" title="'+r.avant+' sur la période précédente'
    +(r.evolFragile?" — trop peu de volume pour conclure":"")+'">'
    +fl+' '+(r.evol>0?"+":"")+Math.round(r.evol)+' %</b>';
}
function acRendAnTxt(v){
  if(v==null)return '<span class="muted">—</span>';
  var col=v>=300?"#166534":(v>=120?"#b45309":"#b91c1c");
  return '<b style="color:'+col+'">'+Math.round(v)+' %</b>';
}
function acJoursTxt(n){
  if(n==null)return '<span class="muted">—</span>';
  var col=n<=30?"#166534":(n<=90?"#b45309":"#b91c1c");
  return '<b style="color:'+col+'">'+n+' j</b>';
}
function acVide(txt){
  return '<div class="tablecard" style="padding:22px;text-align:center;color:var(--muted)">'+esc(txt)+'</div>';
}

/* ---- Courbe de tailles ------------------------------------------------------
   « Quelle taille je commande trop, laquelle pas assez. »

   Le raisonnement est une règle de trois. Si une pointure représente 20 % des
   ventes, elle devrait représenter 20 % du stock : c'est le stock idéal. L'écart
   entre ce stock idéal et le stock réel donne, en paires, ce qu'il faut ajouter
   ou ce qu'il y a en trop. Un chiffre directement utilisable au moment de passer
   la commande, là où un pourcentage demande encore un calcul mental.

   Deux précautions indispensables :

   · Un genre à la fois. Les grilles se chevauchent — un 40 Femme et un 40 Homme
     ne s'adressent pas au même client — et les additionner produirait une courbe
     qui ne correspond à personne.

   · Sizechart obligatoire. Sans grille déclarée sur le modèle, la conversion vers
     l'EU n'est pas fiable : une taille saisie en US serait lue comme une pointure
     européenne et fausserait toute la courbe. Ces pièces sont écartées ici, mais
     restent comptées partout ailleurs — leur marge, elle, est bien réelle. */
function acCourbeTailles(ventes,stock,jours){
  var chaussure=function(r){
    return r.famille==="Sneakers"&&r.genre!=="Non classé"&&r.eu!=null;
  };
  var V=ventes.filter(chaussure), S=stock.filter(chaussure);
  var genres={};
  V.forEach(function(r){genres[r.genre]=1;});
  S.forEach(function(r){genres[r.genre]=1;});

  var ordre=["Homme","Femme","Junior","Enfant"];
  return Object.keys(genres).sort(function(a,b){
      var ia=ordre.indexOf(a), ib=ordre.indexOf(b);
      return (ia<0?99:ia)-(ib<0?99:ib);
    }).map(function(g){
      var v=V.filter(function(r){return r.genre===g;});
      var s=S.filter(function(r){return r.genre===g;});
      var rows=acCroise(v,s,function(r){return String(r.eu);},jours);
      var totS=s.length, totV=v.reduce(function(n,r){return n+Math.max(0,r.sign);},0);
      rows.forEach(function(r){
        r.eu=parseFloat(r.cle);
        /* Stock idéal : la part que cette pointure pèse dans les ventes, appliquée
           au stock total du genre. On garde la valeur non arrondie pour l'écart,
           puis on arrondit — arrondir deux fois ferait dériver le total. */
        var ideal=totS*(r.partV/100);
        r.stockIdeal=Math.round(ideal);
        r.ecartPaires=Math.round(ideal-r.stock);
      });
      rows.sort(function(a,b){return a.eu-b.eu;});
      return {genre:g, rows:rows, nbV:totV, nbS:totS};
    }).filter(function(x){return x.rows.length>0&&(x.nbV>0||x.nbS>0);});
}

/* Deux barres superposées : la demande au-dessus, le stock en dessous. L'œil
   repère le décalage bien plus vite que deux pourcentages côte à côte. */
function acDoubleBarre(partV,partS,max){
  var m=Math.max(1,max);
  var w=function(p){return Math.max(0,Math.min(100,(+p||0)/m*100)).toFixed(1);};
  return '<div style="min-width:78px">'
    +'<div style="height:5px;background:#f1f5f9;border-radius:3px;overflow:hidden;margin-bottom:2px">'
      +'<div style="height:100%;width:'+w(partV)+'%;background:#2563eb"></div></div>'
    +'<div style="height:5px;background:#f1f5f9;border-radius:3px;overflow:hidden">'
      +'<div style="height:100%;width:'+w(partS)+'%;background:#cbd5e1"></div></div>'
    +'</div>';
}

function acEcartTxt(n){
  if(!n)return '<span class="muted">au niveau</span>';
  if(n>0)return '<b style="color:#166534">+ '+n+' à commander</b>';
  return '<b style="color:#b91c1c">'+Math.abs(n)+' en trop</b>';
}

function acSectionTailles(groupes){
  if(!groupes.length)return '<div class="tablecard" style="padding:16px;margin-top:16px">'
    +'<h3 style="margin:0 0 3px">Courbe de tailles</h3>'
    +'<div class="muted" style="font-size:12.5px">Aucun modèle chaussure avec un sizechart déclaré sur la période. '
    +'Renseigne la grille sur les fiches modèles pour activer cette analyse.</div></div>';

  return groupes.map(function(G){
    var maxP=Math.max.apply(null,G.rows.map(function(r){return Math.max(r.partV,r.partS);}).concat([1]));
    var manque=G.rows.filter(function(r){return r.ecartPaires>0;});
    var trop  =G.rows.filter(function(r){return r.ecartPaires<0;});
    var resume="";
    if(manque.length)resume+='À renforcer : <b>'+manque.map(function(r){
      return String(r.eu).replace(".",",")+" (+"+r.ecartPaires+")";}).join(", ")+'</b>. ';
    if(trop.length)resume+='En excès : <b>'+trop.map(function(r){
      return String(r.eu).replace(".",",")+" ("+r.ecartPaires+")";}).join(", ")+'</b>.';
    if(!resume)resume="La répartition du stock suit déjà celle des ventes.";

    return '<div class="tablecard" style="padding:0;overflow:hidden;margin-top:16px">'
      +'<div style="padding:14px 16px 10px"><h3 style="margin:0 0 3px">Courbe de tailles — '+esc(G.genre)+'</h3>'
      +'<div class="muted" style="font-size:12.5px">'+G.nbV+' vendue(s), '+G.nbS+' en stock. '
      +'Le stock idéal applique à chaque pointure la part qu\'elle pèse dans les ventes.</div></div>'
      +'<div style="overflow-x:auto"><table><thead><tr>'
      +'<th>Pointure</th><th>Vendu</th>'
      +'<th title="En haut la part des ventes, en bas la part du stock">Demande / stock</th>'
      +'<th>Part ventes</th><th>Stock</th><th>Part stock</th><th>Couverture</th>'
      +'<th title="Stock que cette pointure devrait représenter, vu son poids dans les ventes">Stock idéal</th>'
      +'<th>Action</th></tr></thead><tbody>'
      +G.rows.map(function(r){
        var fond=r.ecartPaires>0?"background:#f0fdf4":(r.ecartPaires<0?"background:#fef2f2":"");
        return '<tr style="'+fond+'">'
          +'<td><b>'+String(r.eu).replace(".",",")+'</b></td>'
          +'<td>'+r.vendu+'</td>'
          +'<td>'+acDoubleBarre(r.partV,r.partS,maxP)+'</td>'
          +'<td><span class="muted" style="font-size:11.5px">'+String(r.partV).replace(".",",")+' %</span></td>'
          +'<td>'+r.stock+'</td>'
          +'<td><span class="muted" style="font-size:11.5px">'+String(r.partS).replace(".",",")+' %</span></td>'
          +'<td>'+acCouvTxt(r.couverture)+'</td>'
          +'<td>'+r.stockIdeal+'</td>'
          +'<td>'+acEcartTxt(r.ecartPaires)+'</td></tr>';
      }).join("")
      +'</tbody></table></div>'
      +'<div style="padding:10px 16px 16px;font-size:13px;line-height:1.55">'+resume+'</div>'
      +'</div>';
  }).join("");
}

/* ---- Répartition du budget d'achat ------------------------------------------
   La question n'est pas « qu'est-ce qui se vend » mais « où mettre l'argent ».
   Un rayon peut faire du volume en immobilisant tout le capital, pendant qu'un
   autre produit autant de marge avec trois fois moins de stock.

   Le rendement du capital répond à ça : marge dégagée sur la période, rapportée
   à la valeur du stock au prix d'achat. « Pour 100 € immobilisés, tu as sorti
   42 € de marge en six mois. »

   La cible n'est PAS la répartition par marge pure : elle supprimerait d'un trait
   tout segment encore jeune et provoquerait des mouvements ingérables. On déplace
   la moitié du chemin entre la répartition actuelle et celle que justifierait la
   marge — assez pour corriger, assez peu pour rester applicable en une saison. */
function acBudget(ventes,stock,jours){
  var rows=acCroise(ventes,stock,function(r){return r.segment;},jours)
    .filter(function(r){return r.stock>0||r.vendu>0;});
  var capTot=rows.reduce(function(n,r){return n+r.valeurStock;},0);
  var mgTot =rows.reduce(function(n,r){return n+Math.max(0,r.marge);},0);
  rows.forEach(function(r){
    r.rendement=(r.valeurStock>0)?r2(r.marge/r.valeurStock*100):null;
    r.partCap=capTot>0?r2(r.valeurStock/capTot*100):0;
    r.partMg =mgTot>0 ?r2(Math.max(0,r.marge)/mgTot*100):0;
    var ideal=capTot*(r.partMg/100);
    r.cible=r2(r.valeurStock+0.5*(ideal-r.valeurStock));
    r.ecart=r2(r.cible-r.valeurStock);
    /* On n'AUGMENTE pas un budget sur trois ventes : un rendement calculé sur un
       capital minuscule s'envole et ferait investir sur du bruit. Alléger reste
       permis sans seuil — un stock qui ne tourne pas est un fait, pas une
       extrapolation. */
    if(r.vendu<3&&r.ecart>0){r.ecart=0;r.cible=r.valeurStock;}
  });
  rows.sort(function(a,b){return b.valeurStock-a.valeurStock;});
  return {rows:rows,capital:r2(capTot),marge:r2(mgTot),
    rendement:capTot>0?r2(mgTot/capTot*100):null};
}

/* ---- Recommandations -------------------------------------------------------
   Une reco n'est émise que sur un signal SOLIDE : au moins 3 paires vendues sur
   la période. En dessous, un segment paraît en rupture après une seule vente et
   la liste se remplit de bruit qui fait acheter n'importe quoi. */
/* Accord en nombre : « 1 paire » et non « 1 paire(s) ». Un écran consulté tous
   les jours mérite une langue correcte. */
function acPl(n,sing,plur){return n+" "+(Math.abs(n)>1?(plur||(sing+"s")):sing);}
function acRecos(axes,jours){
  var out=[];
  axes.forEach(function(ax){
    ax.rows.forEach(function(r){
      /* Le seuil de 3 ventes ne vaut QUE pour un conseil de rachat : en dessous,
         un segment paraît en rupture après une seule vente et la liste se remplit
         de bruit. Il ne doit surtout pas s'appliquer au surstock — le pire cas est
         justement celui qui ne se vend pas du tout, et l'exiger le masquait. */
      if(r.vendu>=3&&r.couverture!==Infinity&&r.couverture<1.5){
        var manque=Math.max(1,Math.round(r.cadence*2-r.stock));
        /* Un segment qui décroche franchement ne se rachète pas au même rythme :
           la rupture y est le symptôme d'une demande qui s'éteint, pas d'un
           succès. On le dit, plutôt que d'envoyer racheter à l'aveugle. */
        var baisse=(r.evol!=null&&!r.evolFragile&&r.evol<=-25);
        if(baisse)manque=Math.max(1,Math.round(manque/2));
        out.push({p:(r.couverture<0.7?1:2),type:"racheter",axe:ax.nom,cle:r.cle,
          txt:"<b>"+esc(r.cle)+"</b> ("+esc(ax.nom)+") — "+acPl(r.vendu,"vendue")+", "+r.stock
            +" en stock, soit "+(r.couverture?("moins de "+(r.couverture<1?"1 mois":"2 mois")):"rupture")
            +". Prévoir environ <b>"+acPl(manque,"paire")+"</b> pour tenir deux mois."
            +(baisse?(" <i>Attention : le segment recule de "+Math.abs(Math.round(r.evol))
              +" % par rapport à la période précédente — racheter à minima.</i>"):""),
          score:r.tension});
      }else if(r.stock>=4&&r.tension<0&&(r.couverture===Infinity||r.couverture>6)){
        /* Deux niveaux, parce qu'un seuil unique mettait dans le même sac un
           stock mort et la marque qui vend le plus. Au-delà d'un an de
           couverture — ou sans aucune rotation — c'est de l'argent bloqué et on
           arrête. Entre six mois et un an, le segment tourne encore : on ralentit,
           on n'arrête pas. La tension doit être négative dans les deux cas : un
           segment qu'on vend plus qu'on ne le détient ne se freine jamais. */
        var mort=(r.couverture===Infinity||r.couverture>12);
        out.push({p:mort?3:4,type:mort?"freiner":"surveiller",axe:ax.nom,cle:r.cle,
          txt:"<b>"+esc(r.cle)+"</b> ("+esc(ax.nom)+") — "+r.stock+" en stock pour "
            +acPl(r.vendu,"vendue")+" : "+(r.couverture===Infinity?"aucune rotation":(Math.round(r.couverture)+" mois de couverture"))
            +", "+eur(r.valeurStock)+" immobilisés. "
            +(mort?"Ne pas réapprovisionner, et solder.":"Ralentir les achats sur ce segment."),
          score:-r.tension});
      }
    });
  });
  /* Un même segment peut ressortir sur deux axes (« Nike » et « 43 – 45 ») :
     on garde la formulation la plus prioritaire pour ne pas répéter le conseil. */
  var vus={},quota={};
  return out.sort(function(a,b){return a.p-b.p||b.score-a.score;})
    .filter(function(r){
      var k=r.type+"|"+r.cle; if(vus[k])return false; vus[k]=1;
      /* Cinq conseils par nature suffisent : une liste de vingt lignes ne se
         lit pas et noie les deux décisions qui comptent vraiment. */
      quota[r.type]=(quota[r.type]||0)+1;
      return quota[r.type]<=5;
    });
}

/* ---- Écran --------------------------------------------------------------- */
function acSetJours(n){_acJours=+n||180;renderAideCommande();}
function acToggleDepot(){_acSansDepot=!_acSansDepot;renderAideCommande();}
function acToggleWeb(){_acWeb=!_acWeb;renderAideCommande();}

function acExport(){
  var V=acVentes(_acJours), S=acStock();
  var axes=[["Tranche de pointure",function(r){return r.tranche;}],
            ["Genre",function(r){return r.genre;}],
            ["État",function(r){return r.etat;}],
            ["Marque",function(r){return r.marque;}],
            ["Rayon",function(r){return r.famille;}],
            ["Rayon et état",function(r){return r.segment;}]];
  var lignes=[["Axe","Segment","Vendu","Vendu période précédente","Évolution %","Part ventes %",
               "Écoulement médian (j)","Rendement annualisé %","CA TTC","Marge",
               "Marge %","Stock","Valeur stock","Part stock %","Cadence /mois","Couverture (mois)","Tension",
               "Stock idéal","Écart en paires"]];
  var Lav=acVentes(_acJours,_acJours).lignes;
  axes.forEach(function(ax){
    acTendance(acCroise(V.lignes,S,ax[1],_acJours),Lav,ax[1]).forEach(function(r){
      lignes.push([ax[0],r.cle,r.vendu,r.avant,(r.evol==null?"":r.evol),r.partV,
        (r.delai==null?"":r.delai),(r.rendAn==null?"":r.rendAn),r.ca,r.marge,r.margePct,
        r.stock,r.valeurStock,r.partS,r.cadence,(r.couverture===Infinity?"":Math.round(r.couverture*10)/10),r.tension]);
    });
  });
  /* La courbe de tailles part aussi à l'export : c'est la table qu'on emmène
     chez le fournisseur, et elle ne se recopie pas à la main. */
  acCourbeTailles(V.lignes,S,_acJours).forEach(function(G){
    G.rows.forEach(function(r){
      lignes.push(["Pointure "+G.genre,r.cle,r.vendu,r.avant,(r.evol==null?"":r.evol),r.partV,
        (r.delai==null?"":r.delai),(r.rendAn==null?"":r.rendAn),r.ca,r.marge,r.margePct,
        r.stock,r.valeurStock,r.partS,r.cadence,
        (r.couverture===Infinity?"":Math.round(r.couverture*10)/10),r.tension,
        r.stockIdeal,r.ecartPaires]);
    });
  });
  var csv=lignes.map(function(r){return r.map(function(c){
    return '"'+String(c).replace(/"/g,'""')+'"';}).join(";");}).join("\r\n");
  var blob=new Blob(["﻿"+csv],{type:"text/csv;charset=utf-8"});
  var url=URL.createObjectURL(blob), a=document.createElement("a");
  a.href=url;a.download="aide-commande-"+today()+".csv";
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  setTimeout(function(){URL.revokeObjectURL(url);},1000);
}

/* Tableau de réallocation du capital, suivi des mouvements à faire en clair. */
function acSectionBudget(B,jours){
  if(!B.rows.length)return "";
  var mois=Math.round(jours/30.4*10)/10;
  var h='<div class="tablecard" style="padding:0;overflow:hidden;margin-top:16px">'
    +'<div style="padding:14px 16px 10px"><h3 style="margin:0 0 3px">Où mettre l\'argent</h3>'
    +'<div class="muted" style="font-size:12.5px">'
    +eur(B.capital)+' immobilisés en stock, '+eur(B.marge)+' de marge sur '
    +String(mois).replace(".",",")+' mois'
    +(B.rendement!=null?(' — soit <b>'+String(B.rendement).replace(".",",")
      +' € de marge pour 100 € investis</b>'):'')+'.</div></div>'
    +'<div style="overflow-x:auto"><table><thead><tr>'
    +'<th>Segment</th><th>Capital en stock</th><th>Part du capital</th>'
    +'<th>Marge générée</th><th>Part de la marge</th>'
    +'<th title="Marge dégagée pour 100 € immobilisés sur la période">Rendement</th>'
    +'<th title="Rendement ramené à l\'année : taux de marge multiplié par la rotation du capital">Rendement / an</th>'
    +'<th>Couverture</th><th>Budget cible</th><th>Mouvement</th></tr></thead><tbody>';
  var maxCap=Math.max.apply(null,B.rows.map(function(r){return r.valeurStock;}).concat([1]));
  h+=B.rows.map(function(r){
    var rc=(r.rendement==null)?'<span class="muted">—</span>'
      :'<b style="color:'+(r.rendement>=40?"#166534":(r.rendement>=15?"#b45309":"#b91c1c"))+'">'
        +String(r.rendement).replace(".",",")+' %</b>';
    var mv=(Math.abs(r.ecart)<25)?'<span class="muted">à l\'équilibre</span>'
      :'<b style="color:'+(r.ecart>0?"#166534":"#b91c1c")+'">'
        +(r.ecart>0?"+ ":"− ")+eur(Math.abs(r.ecart))+'</b>';
    return '<tr><td><b>'+esc(r.cle)+'</b></td>'
      +'<td>'+eur(r.valeurStock)+'<div style="margin-top:3px">'
        +acBarre(r.valeurStock,"#94a3b8",maxCap)+'</div></td>'
      +'<td><span class="muted" style="font-size:11.5px">'+String(r.partCap).replace(".",",")+' %</span></td>'
      +'<td><b>'+eur(r.marge)+'</b></td>'
      +'<td><span class="muted" style="font-size:11.5px">'+String(r.partMg).replace(".",",")+' %</span></td>'
      +'<td>'+rc+'</td>'
      +'<td>'+acRendAnTxt(r.rendAn)+'</td>'
      +'<td>'+acCouvTxt(r.couverture)+'</td>'
      +'<td>'+eur(r.cible)+'</td>'
      +'<td>'+mv+'</td></tr>';
  }).join("")+'</tbody></table></div>';

  /* Les mouvements en toutes lettres : un tableau se lit, une phrase se décide. */
  var haut=B.rows.filter(function(r){return r.ecart>=25;}).sort(function(a,b){return b.ecart-a.ecart;});
  var bas =B.rows.filter(function(r){return r.ecart<=-25;}).sort(function(a,b){return a.ecart-b.ecart;});
  h+='<div style="padding:4px 16px 16px">';
  if(!haut.length&&!bas.length){
    h+='<div class="muted" style="font-size:13px">La répartition actuelle correspond déjà à ce que chaque segment rapporte. Rien à arbitrer.</div>';
  }else{
    h+='<div class="muted" style="font-size:12.5px;margin-bottom:8px">Cible indicative : on comble la moitié de l\'écart entre la répartition d\'aujourd\'hui et celle que justifierait la marge. À pondérer par tes contraintes fournisseurs.</div>';
    bas.slice(0,3).forEach(function(r){
      var vers=haut.length?haut[0].cle:null;
      h+='<div style="font-size:13px;line-height:1.55;padding:7px 11px;border:1px solid #fecaca;'
        +'background:#fef2f2;border-radius:9px;margin-bottom:6px">Alléger <b>'+esc(r.cle)+'</b> d\'environ <b>'
        +eur(Math.abs(r.ecart))+'</b> — '+String(r.partCap).replace(".",",")+' % du capital pour '
        +String(r.partMg).replace(".",",")+' % de la marge'
        +(vers?(', et le redéployer vers <b>'+esc(vers)+'</b>'):'')+'.</div>';
    });
    haut.slice(0,3).forEach(function(r){
      h+='<div style="font-size:13px;line-height:1.55;padding:7px 11px;border:1px solid #bbf7d0;'
        +'background:#f0fdf4;border-radius:9px;margin-bottom:6px">Renforcer <b>'+esc(r.cle)+'</b> d\'environ <b>'
        +eur(r.ecart)+'</b> — '+(r.rendement!=null?(String(r.rendement).replace(".",",")+' € de marge pour 100 € investis'):'bon rendement')
        +', et seulement '+String(r.partCap).replace(".",",")+' % du capital.</div>';
    });
  }
  h+='</div></div>';
  return h;
}

function renderAideCommande(){
  var body=document.getElementById("reBody");if(!body)return;
  var V=acVentes(_acJours), S=acStock(), L=V.lignes;
  // Même durée, juste avant : c'est la seule comparaison qui ait un sens.
  var Lav=acVentes(_acJours,_acJours).lignes;

  var parTranche=acCroise(L,S,function(r){return r.tranche;},_acJours);
  /* Un modèle sans sizechart n'a pas de genre exploitable : la ligne « Non classé »
     n'apprenait rien et regroupait pêle-mêle sacs, textile et fiches incomplètes. */
  var parGenre  =acCroise(L,S,function(r){return r.genre;},_acJours)
    .filter(function(r){return r.cle!=="Non classé";});
  var parEtat   =acCroise(L,S,function(r){return r.etat;},_acJours);
  var parMarque =acCroise(L,S,function(r){return r.marque;},_acJours);
  var parFam    =acCroise(L,S,function(r){return r.famille;},_acJours);
  var parCanal  =_acWeb?acCroise(L,S,function(r){return r.canal;},_acJours):null;
  var parSeg    =acCroise(L,S,function(r){return r.segment;},_acJours)
    .filter(function(r){return AC_SEGMENTS_MASQUES.indexOf(r.cle)<0;});
  var parModele =acCroise(L,S,function(r){return r.titre;},_acJours);
  var budget    =acBudget(L,S,_acJours);
  var courbes   =acCourbeTailles(L,S,_acJours);
  acTendance(parTranche,Lav,function(r){return r.tranche;});
  acTendance(parGenre,  Lav,function(r){return r.genre;});
  acTendance(parEtat,   Lav,function(r){return r.etat;});
  acTendance(parMarque, Lav,function(r){return r.marque;});
  acTendance(parFam,    Lav,function(r){return r.famille;});
  acTendance(parSeg,    Lav,function(r){return r.segment;});
  acTendance(parModele, Lav,function(r){return r.titre;});
  acTendance(budget.rows,Lav,function(r){return r.segment;});
  if(parCanal)acTendance(parCanal,Lav,function(r){return r.canal;});

  // Les tranches gardent l'ordre des pointures : un classement par volume ferait
  // perdre la lecture « du petit pied au grand », qui est justement l'intérêt.
  parTranche.sort(function(a,b){return AC_TRANCHES.indexOf(a.cle)-AC_TRANCHES.indexOf(b.cle);});

  var nbV=L.reduce(function(n,r){return n+r.sign;},0);
  var ca=r2(L.reduce(function(n,r){return n+r.ttc;},0));
  var mg=r2(L.reduce(function(n,r){return n+r.marge;},0));
  var delais=L.filter(function(r){return r.sign>0&&r.jours!=null;}).map(function(r){return r.jours;});
  var valStock=r2(S.reduce(function(n,r){return n+r.cout;},0));
  var cadence=Math.max(0,nbV)/Math.max(0.1,_acJours/30.4);
  var couvGlob=cadence>0?(S.length/cadence):Infinity;

  var nbAv=Lav.reduce(function(n,r){return n+r.sign;},0);
  var evolGlob=(nbAv>0)?r2((Math.max(0,nbV)-nbAv)/nbAv*100):null;
  var kpi=function(t,v,s,col){
    return '<div class="tablecard" style="padding:13px 15px;flex:1;min-width:150px">'
      +'<div class="muted" style="font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.4px">'+esc(t)+'</div>'
      +'<div style="font-size:21px;font-weight:800;margin-top:3px'+(col?(';color:'+col):'')+'">'+v+'</div>'
      +(s?'<div class="muted" style="font-size:11.5px;margin-top:1px">'+s+'</div>':'')+'</div>';
  };

  var recos=acRecos([{nom:"pointure",rows:parTranche},{nom:"genre",rows:parGenre},
    {nom:"état",rows:parEtat},{nom:"marque",rows:parMarque}],_acJours);

  var periodes=[[30,"30 j"],[90,"3 mois"],[180,"6 mois"],[365,"12 mois"],[1095,"3 ans"]];

  var h=''
  // ---- Barre de contrôle
  +'<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px">'
    +'<div style="display:flex;gap:6px;flex-wrap:wrap">'
    +periodes.map(function(p){
      var on=_acJours===p[0];
      return '<button class="btn'+(on?' v':'')+'" onclick="acSetJours('+p[0]+')" '
        +'style="padding:6px 13px;font-size:12.5px">'+p[1]+'</button>';
    }).join("")
    +'</div>'
    +'<label style="display:flex;align-items:center;gap:7px;font-size:12.5px;cursor:pointer;margin-left:4px" '
      +'title="Les ventes du site comptent dans la demande, mais son stock est le même qu\'en boutique">'
      +'<input type="checkbox" '+(_acWeb?"checked":"")+' onchange="acToggleWeb()">'
      +'Inclure le site</label>'
    +'<label style="display:flex;align-items:center;gap:7px;font-size:12.5px;cursor:pointer">'
      +'<input type="checkbox" '+(_acSansDepot?"checked":"")+' onchange="acToggleDepot()">'
      +'Ignorer le dépôt-vente</label>'
    +'<button class="btn" onclick="acExport()" style="margin-left:auto;padding:6px 13px;font-size:12.5px">Export CSV</button>'
  +'</div>'
  +'<div class="muted" style="font-size:12px;margin:-6px 0 12px">Période analysée : du '
    +esc(V.from)+' au '+esc(V.to)
    +(_acWeb?' · boutique et site':' · <b>boutique seule</b>, le site est exclu')
    +' · <b>stock issu des commandes d\'achat</b>, hors dropshipping'
    +(_acSansDepot?' · dépôt-vente exclu':' · dépôt-vente inclus')+'</div>'
  /* Une exclusion muette finit par être oubliée à la lecture des chiffres : on
     dit combien de lignes ont été écartées, et pourquoi. */
  +((_acExclus.ventes||_acExclus.stock)
    ?('<div style="font-size:12px;color:#334155;background:#f8fafc;border:1px solid var(--line);'
      +'border-radius:9px;padding:8px 11px;margin-bottom:14px">Écarté du calcul : '
      +(_acExclus.ventes?('<b>'+_acExclus.ventes+'</b> vente(s) '):'')
      +(_acExclus.ventes&&_acExclus.stock?'et ':'')
      +(_acExclus.stock?('<b>'+_acExclus.stock+'</b> paire(s) en stock '):'')
      +'en dropshipping FlowStock — ces paires ne passent jamais par le stock, elles '
      +'n\'immobilisent aucun capital et ne créent aucun besoin de réassort.</div>'):'')
  +(_acWeb
    ?'<div style="font-size:12px;color:#92400e;background:#fffbeb;border:1px solid #fde68a;'
      +'border-radius:9px;padding:8px 11px;margin-bottom:14px">Le site et la boutique partagent '
      +'le même stock : une paire en rayon peut partir des deux côtés. Les deux demandes sont donc '
      +'additionnées ici, ce qui est le bon calcul pour décider d\'un réassort.</div>'
    :'<div style="font-size:12px;color:#92400e;background:#fffbeb;border:1px solid #fde68a;'
      +'border-radius:9px;padding:8px 11px;margin-bottom:14px">Le stock affiché reste le stock '
      +'total, puisqu\'une paire en rayon peut aussi partir sur le site. Les durées de couverture '
      +'sont donc un majorant : la rotation réelle est plus rapide.</div>')

  // ---- KPI
  +'<div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px">'
    +kpi("Paires vendues",String(nbV),
      (evolGlob==null?(Math.round(cadence*10)/10+" par mois")
        :((evolGlob>0?"+":"")+Math.round(evolGlob)+" % vs période précédente")),
      (evolGlob==null?"":(evolGlob>=0?"#166534":"#b91c1c")))
    +kpi("CA TTC",eur(ca),"")
    +kpi("Marge",eur(mg),(ca>0?String(r2(mg/ca*100)).replace(".",",")+" %":""),"#166534")
    +kpi("Écoulement médian",(acMediane(delais)!=null?acMediane(delais)+" j":"—"),"entrée → vente")
    +kpi("Stock actuel",String(S.length)+" paires",eur(valStock))
    +kpi("Couverture",(couvGlob===Infinity?"—":(Math.round(couvGlob*10)/10+" mois").replace(".",",")),"au rythme actuel",
      (couvGlob!==Infinity&&couvGlob<1.5)?"#b91c1c":((couvGlob!==Infinity&&couvGlob>6)?"#6d28d9":""))
  +'</div>';

  if(!L.length){
    body.innerHTML=h+acVide("Aucune vente facturée sur cette période. Élargis la période ou vérifie le filtre société.");
    return;
  }

  // ---- Recommandations
  h+='<div class="tablecard" style="padding:16px;margin-bottom:16px">'
    +'<h3 style="margin:0 0 3px">Ce que disent les chiffres</h3>'
    +'<div class="muted" style="font-size:12.5px;margin-bottom:10px">Segments d\'au moins 3 ventes sur la période — en dessous, le signal n\'est pas fiable.</div>';
  if(!recos.length){
    h+='<div class="muted" style="font-size:13px">Rien de saillant : aucun segment n\'est en tension ni en surstock marqué.</div>';
  }else{
    h+=recos.map(function(r){
      var c=r.type==="racheter"?["#166534","#f0fdf4","#bbf7d0","À racheter"]
        :(r.type==="freiner"?["#b91c1c","#fef2f2","#fecaca","À freiner"]
                            :["#b45309","#fffbeb","#fde68a","À surveiller"]);
      return '<div style="display:flex;gap:10px;align-items:flex-start;padding:9px 11px;border:1px solid '+c[2]
        +';background:'+c[1]+';border-radius:10px;margin-bottom:7px">'
        +'<span style="flex:0 0 auto;font-size:11px;font-weight:800;color:'+c[0]
        +';text-transform:uppercase;letter-spacing:.3px;padding-top:2px">'+c[3]+'</span>'
        +'<span style="font-size:13px;line-height:1.5">'+r.txt+'</span></div>';
    }).join("");
  }
  h+='</div>';

  // ---- Axes d'analyse
  h+='<div style="display:grid;gap:16px">'
    +acTable("Par pointure","Où part la demande, et où le stock ne suit pas. C'est ici que se décide un réassort de tailles.",parTranche,"Tranche")
    +acTable("Par genre","D'après le sizechart du modèle. Les modèles sans grille déclarée sont écartés : leur pointure n'est pas interprétable.",parGenre,"Genre")
    +acTable("Neuf ou seconde main","Tout ce qui n'est pas marqué « Neuf » compte comme seconde main.",parEtat,"État")

    +acTable("Par rayon","Sneakers, maroquinerie, textile : trois métiers, trois rotations. La famille vient de la taxonomie du modèle.",parFam,"Rayon")
    +acTable("Rayon et état croisés","Le détail qui décide un achat : du neuf en maroquinerie ne se pilote pas comme de la seconde main en sneakers.",parSeg,"Segment")
    /* Le canal n'a de sens que si le site compte : sinon la colonne n'aurait
       qu'une seule ligne. Les colonnes de stock y sont trompeuses — le stock est
       commun aux deux canaux — mais les volumes et les marges, eux, sont justes. */
    +(parCanal?acTable("Par canal","Où se font les ventes. Les colonnes de stock ne sont pas ventilables : le stock est commun aux deux canaux.",parCanal,"Canal"):"")
  +'</div>';

// Une pièce peut être stockée en US (10.5) alors que la grille suit l'EU (44.5) : on compare les deux.
function reSameSize(v,size){
  if(!v)return false;
  var s=String(size).trim().toLowerCase();
  if(String(v.taille==null?"":v.taille).trim().toLowerCase()===s)return true;
  try{
    if(v.eu!=null&&v.eu!==""&&String(v.eu).trim().toLowerCase()===s)return true;
    var e=shopSizeEU(v);if(e&&String(e).trim().toLowerCase()===s)return true;

    var usMap=(DB.grilles["__us"]||{})[m.todsGrille||m.grille]||{};
    if(usMap[String(size)]&&String(usMap[String(size)]).trim().toLowerCase()===String(v.taille).trim().toLowerCase())return true;
  }catch(e){}
  return false;
}
// Un SKU peut en regrouper plusieurs : « BZ0057/B75806 ». On compare référence par référence.
function skuTokens(s){
  return String(s||"").toLowerCase().split(/[\/,;|+]+/).map(function(x){return x.trim();}).filter(Boolean);
}
function sameSku(a,b){
  var A=skuTokens(a),B=skuTokens(b);
  if(!A.length||!B.length)return false;
  return A.some(function(x){return B.indexOf(x)>=0;});
}
function boutiqueStockOfSize(mid,size){

  return (DB.articles||[]).filter(function(p){
    if(p.archived||(p.statut!=="En Stock"&&p.statut!=="Approvisionnement")||!reTvaOk(p))return false;
    var v=varById(p.varianteId);if(!v||v.id==null)return false;

}

function reGridSizes(m){if(!m)return [];var g=m.todsGrille||m.grille;if(g&&DB.grilles[g])return DB.grilles[g].slice();var keys=reGrilleKeys();return keys.length?(DB.grilles[keys[0]]||[]).slice():[];}
function reGridVariants(m){
  if(!m)return [];
  var order=DB.grilles[m.grille]||attrLabels("Taille");
  var usMap=(DB.grilles["__us"]||{})[m.grille]||{};
  var rev={};Object.keys(usMap).forEach(function(eu){rev[String(usMap[eu]).trim().toLowerCase()]=eu;});
  // Le rang se calcule sur la taille EU : une variante stockée en US (10.5) doit se ranger
  // à la place de son EU (44.5), sinon elle sort de la grille et atterrit en vrac à la fin.
  var rank=function(v){
    var t=String(v.taille==null?"":v.taille).trim();
    var i=order.indexOf(t);if(i>=0)return i;
    var eu=(v.eu!=null&&v.eu!=="")?String(v.eu).trim():(rev[t.toLowerCase()]||"");
    if(eu){var j=order.indexOf(eu);if(j>=0)return j;}
    return -1;
  };
  return (varsOf(m.id)||[]).slice().sort(function(a,b){
    var ia=rank(a),ib=rank(b);
    if(ia>=0&&ib>=0)return ia-ib;
    if(ia>=0)return -1;
    if(ib>=0)return 1;
    // hors grille : tri numérique naturel (37.5 avant 38), puis alphabétique
    var na=parseFloat(String(a.taille).replace(",",".")),nb=parseFloat(String(b.taille).replace(",","."));
    if(!isNaN(na)&&!isNaN(nb)&&na!==nb)return na-nb;
    return String(a.taille).localeCompare(String(b.taille),"fr",{numeric:true});
  });
}

/* Ramène une clé de taille (US brut OU EU) à sa pointure US canonique, pour
   dédoublonner les cibles qui désignent la même pointure (ex. "9" US == "42.5" EU). */
function reCanonSize(m,key){
  var k=String(key==null?"":key).trim();
  if(!k)return "";
  var grille=(m&&(m.todsGrille||m.grille))||"";
  var usMap=(DB.grilles["__us"]||{})[grille]||{};   // EU -> US
  // Si la clé est une taille EU connue de la grille, renvoyer sa version US.
  if(usMap[k]!=null&&usMap[k]!=="")return String(usMap[k]).trim();
  // Sinon, c'est déjà une taille US (ou inconnue) : on la garde telle quelle.
  return k;
}
/* Cibles dédoublonnées par pointure US : { pointureUS : cibleMax }.
   Si deux clés (US + EU) pointent la même pointure, on n'en garde qu'une. */
function reCiblesCanon(m){
  var cibles=m&&m.cibles||{};var out={};
  Object.keys(cibles).forEach(function(k){
    var c=reCanonSize(m,k);if(!c)return;
    var val=+cibles[k]||0;
    // on garde la cible la plus élevée si collision (sécurité)
    if(out[c]==null||val>out[c])out[c]=val;
  });
  return out;
}
function reModelRows(m){
  if(!m)return [];
  var cibles=m.cibles||{};
  var vars=reGridVariants(m);
  var seen={};var out=[];
  vars.forEach(function(v){
    var key=String(v.taille==null?"":v.taille).trim();
    if(!key)return;
    // une variante suivie = une cible existe pour SA taille (ou son eu)
    var on=(cibles[key]!=null);var ck=key;
    if(!on && v.eu!=null && cibles[String(v.eu).trim()]!=null){on=true;ck=String(v.eu).trim();}
    if(!on)return;                      // taille non suivie : ignorée
    if(seen[ck])return;seen[ck]=1;      // sécurité anti-doublon de variante
    var cible=+cibles[ck]||0;
    var st=boutiqueStockOfSize(m.id,key);
    out.push({m:m,size:key,cible:cible,st:st,manque:Math.max(0,cible-st),on:true});
  });
  return out;
}

      +'</tbody></table></div></div>';
}
function reToggleAll(id,on){var m=modeleById(id);if(!m)return;var vars=reGridVariants(m);m.cibles=m.cibles||{};if(on){vars.forEach(function(v){var k=String(v.taille);if(m.cibles[k]==null)m.cibles[k]=1;});}else{vars.forEach(function(v){delete m.cibles[String(v.taille)];});}save();renderReassort();}

/* ---------- Démarrage ---------- */
const loginOverlay=document.getElementById("loginOverlay");
const loginBtn=document.getElementById("loginBtn");
const loginEmail=document.getElementById("loginEmail");
const loginPass=document.getElementById("loginPass");
const loginErr=document.getElementById("loginErr");

async function _apresAuth(){loginOverlay.style.display="none";await load();}
loginBtn.onclick=async()=>{
  loginErr.textContent="";loginBtn.disabled=true;loginBtn.textContent="Connexion…";
  const {error}=await sb.auth.signInWithPassword({email:(loginEmail.value||"").trim(),password:loginPass.value||""});
  loginBtn.disabled=false;loginBtn.textContent="Se connecter";
  if(error){loginErr.textContent="Connexion refusée : "+(error.message||"identifiants invalides");return;}
  await _apresAuth();
};
loginPass.addEventListener("keydown",e=>{if(e.key==="Enter")loginBtn.click();});
document.getElementById("logoutBtn").onclick=async()=>{await sb.auth.signOut();location.reload();};
document.getElementById("reloadBtn").onclick=async function(){
  const b=this;b.disabled=true;b.textContent="…";
  try{await load();}catch(e){}
  b.disabled=false;b.textContent="Actualiser";
};
(async()=>{
  try{
    const {data:{session}}=await sb.auth.getSession();
    if(session){await _apresAuth();}
    else{document.getElementById("chargement").style.display="none";loginOverlay.style.display="flex";}
  }catch(e){
    document.getElementById("chargement").style.display="none";
    loginOverlay.style.display="flex";
  }
})();
</script>
</body>
</html>
